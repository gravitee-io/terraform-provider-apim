name: Terraform Provider Tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: 00 05 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-oas:
    name: Verify OAS schema matches APIM
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify OAS schema matches upstream, in CircleCI where the token that reads the APIM repository lives
        working-directory: hack/scripts
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          # head_ref is empty on push, schedule and workflow_dispatch.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npm ci
          npx zx verify-oas.mjs --check apim --branch "$BRANCH"
      - name: Send slack notification
        if: (failure() || success()) && github.event.schedule != ''
        continue-on-error: true
        uses: ./.github/actions/send-slack-notification
        with:
          job_name: ${{ github.job }}
          job_status: ${{ job.status }}
          circleci_token: ${{ secrets.CIRCLECI_TOKEN }}
          trigger: test_results_notification
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup go
        uses: ./.github/actions/setup-go
      - name: Run unit tests
        run: make unit-tests
