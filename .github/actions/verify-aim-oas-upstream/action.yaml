name: Verify AI Management OAS matches upstream

description: |
  Fetches the AI Management OpenAPI fragment at the tag the Makefile pins
  (AIM_OAS_REF) and verifies it matches the local automation-api-aim-oas.yaml.
  The repository is private: the caller sets GH_TOKEN to a token that reads it.

runs:
  using: composite
  steps:
    - name: Sync AI Management OAS
      shell: bash
      run: make sync-aim-oas
    - name: Verify AI Management OAS matches upstream
      shell: bash
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ ERROR: Local automation-api-aim-oas.yaml differs from upstream source"
            export PAGER= # don't let `git diff` invoke `less`
            git diff
            exit 1
        fi
