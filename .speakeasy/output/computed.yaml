          x-speakeasy-param-computed: false
        description:
          type: string
          examples:
            - GitHub tools proxied through the gateway
          description: Human description of the proxy; converges on re-apply
          x-speakeasy-param-computed: false
        contextPath:
          type: string
          examples:
            - /mcp/github
          description: Context path the gateway serves the proxy on; must be available in the environment
          x-speakeasy-param-computed: false
        mode:
          $ref: '#/components/schemas/AimMcpProxyMode'
          x-speakeasy-param-computed: false
        proxy:
          x-speakeasy-param-computed: false
          allOf:
            - $ref: '#/components/schemas/AimMcpProxyProxy'
