            `tools/call` with the called tool as the resource; `false` removes it. That flow belongs to the
            platform: `flows` may not carry an `authz-pep` step themselves, and the state reports the declared
            flows without it.
          default: false
          x-speakeasy-param-computed: false
      required:
        - tools
        - upstreamAuth
      description: |
        What a `STUDIO` exposes: tools picked from catalog MCP servers of the environment, the credential the
        gateway presents to each of those servers, and whether the platform's fine-grained authorization runs on
        tool calls. Tools converge as a set — adding, removing or re-aliasing one replaces the studio's tool
        surface — and `upstreamAuth` converges per server.
      x-speakeasy-param-computed: false
    AimMcpProxyStudioTool:
      type: object
      properties:
        server:
          type: string
          examples:
            - github-mcp
          description: HRID of the `catalog/mcp-servers` resource of this environment the tool comes from
          x-speakeasy-param-computed: false
        tool:
          type: string
          examples:
            - create_issue
          description: Runtime name of the tool, as the server's state lists it under `tools`
          x-speakeasy-param-computed: false
        alias:
          type: string
          examples:
            - gh_create_issue
          pattern: ^[a-zA-Z0-9_=-]+$
          description: |
            Name the studio exposes the tool under, when the runtime name collides with another tool's or reads
            better renamed; effective names must be unique across the studio
          x-speakeasy-param-computed: false
        entityId:
          type: string
          description: Composed entity id of the tool, the name an authorization policy references, e.g. `mcp-tool.github.create_issue`
          readOnly: true
          x-speakeasy-param-computed: true
      required:
        - server
        - tool
      description: A tool the studio exposes, picked from a catalog MCP server
    AimMcpProxyStudioUpstreamAuth:
      type: object
      properties:
        server:
          type: string
          examples:
            - github-mcp
          description: HRID of the `catalog/mcp-servers` resource the credential is for
          x-speakeasy-param-computed: false
        auth:
          $ref: '#/components/schemas/AimMcpProxyUpstreamAuth'
          x-speakeasy-param-computed: false
      required:
        - server
        - auth
      description: The credential the gateway presents to one of the studio's catalog servers
    AimMcpProxyUpstreamAuth:
      discriminator:
        propertyName: type
        mapping:
          NONE: '#/components/schemas/AimMcpProxyNoUpstreamAuth'
          API_KEY: '#/components/schemas/AimMcpProxyApiKeyUpstreamAuth'
          BEARER: '#/components/schemas/AimMcpProxyBearerUpstreamAuth'
          BASIC: '#/components/schemas/AimMcpProxyBasicUpstreamAuth'
          OAUTH2: '#/components/schemas/AimMcpProxyOAuth2UpstreamAuth'
      description: |
        Authentication the gateway uses against the upstream MCP server, discriminated by `type`. Credential values
        are stored verbatim: a literal, or a `secret://` URI pointing at a configured secret provider. They are
        never returned by this API. Omitting `proxy.upstreamAuth`, or declaring `type: NONE`, means the gateway passes
        the caller's credentials through — and clears any stored upstream authentication.
      oneOf:
        - $ref: '#/components/schemas/AimMcpProxyNoUpstreamAuth'
        - $ref: '#/components/schemas/AimMcpProxyApiKeyUpstreamAuth'
        - $ref: '#/components/schemas/AimMcpProxyBearerUpstreamAuth'
        - $ref: '#/components/schemas/AimMcpProxyBasicUpstreamAuth'
        - $ref: '#/components/schemas/AimMcpProxyOAuth2UpstreamAuth'
      x-speakeasy-param-computed: false
    AimMcpProxyNoUpstreamAuth:
      allOf:
        - type: object
          properties:
            type:
              type: string
              description: Type of upstream authentication
              enum:
                - NONE
              default: NONE
          required: ["type"]
      description: No upstream authentication; the gateway passes the caller's credentials through
    AimMcpProxyApiKeyUpstreamAuth:
      allOf:
        - type: object
          properties:
            apiKeyHeader:
              type: string
              examples:
                - X-Api-Key
              description: Name of the header carrying the API key
              x-speakeasy-param-computed: false
            apiKey:
              type: string
              format: password
              description: API key value, a literal or a `secret://` URI stored verbatim; never returned
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            type:
              type: string
              description: Type of upstream authentication
              enum:
                - API_KEY
              default: API_KEY
              x-speakeasy-param-computed: false
          required:
            - apiKeyHeader
            - apiKey
            - "type"
      description: A static API key sent to the upstream server in a header
    AimMcpProxyBearerUpstreamAuth:
      allOf:
        - type: object
          properties:
            token:
              type: string
              format: password
              description: Bearer token, a literal or a `secret://` URI stored verbatim; never returned
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            type:
              type: string
              description: Type of upstream authentication
              enum:
                - BEARER
              default: BEARER
              x-speakeasy-param-computed: false
          required:
            - token
            - "type"
      description: A static bearer token sent to the upstream server
    AimMcpProxyBasicUpstreamAuth:
      allOf:
        - type: object
          properties:
            username:
              type: string
              description: Basic authentication user name
              x-speakeasy-param-computed: false
            password:
              type: string
              format: password
              description: Basic authentication password, a literal or a `secret://` URI stored verbatim; never returned
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            type:
              type: string
              description: Type of upstream authentication
              enum:
                - BASIC
              default: BASIC
              x-speakeasy-param-computed: false
          required:
            - username
            - password
            - "type"
      description: Basic credentials sent to the upstream server
    AimMcpProxyOAuth2UpstreamAuth:
      allOf:
        - type: object
          properties:
            authorizeUrl:
              type: string
              format: uri
              description: Authorization endpoint the elicitation flow sends the user to
              x-speakeasy-param-computed: false
            tokenUrl:
              type: string
              format: uri
              description: Token endpoint the gateway exchanges the authorization code at
              x-speakeasy-param-computed: false
            clientId:
              type: string
              description: Client id of the upstream OAuth 2.0 client
              x-speakeasy-param-computed: false
            clientSecret:
              type: string
              format: password
              description: Client secret of the upstream OAuth 2.0 client, a literal or a `secret://` URI stored verbatim; never returned
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            scopes:
              type: array
              items:
                type: string
              description: Scopes requested with the token
              x-speakeasy-param-computed: true
              x-speakeasy-plan-modifiers: IgnoreEmptyList
            type:
              type: string
              description: Type of upstream authentication
              enum:
                - OAUTH2
              default: OAUTH2
              x-speakeasy-param-computed: false
          required:
            - authorizeUrl
            - tokenUrl
            - clientId
            - clientSecret
            - "type"
      description: OAuth 2.0 authentication negotiated with the upstream server through MCP elicitation
    AimMcpProxyPlan:
      type: object
      properties:
        name:
          type: string
          examples:
            - gold
          description: Name of the plan, the key plan convergence matches on
          x-speakeasy-param-computed: false
        security:
          $ref: '#/components/schemas/AimMcpProxyPlanSecurity'
          x-speakeasy-param-computed: false
        flows:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyFlow'
          description: |
            Policy flows of the plan, in execution order, run before the proxy's own on requests the plan
            matched. Owned by the manifest like the proxy's flows, and — unlike `security` — free to change in
            place under the same plan name.
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
      required:
        - name
        - security
      description: A plan consumers subscribe to; identified by its name within the proxy
    AimMcpProxyPlanSecurity:
      discriminator:
        propertyName: type
        mapping:
          KEY_LESS: '#/components/schemas/AimMcpProxyKeyLessPlanSecurity'
          API_KEY: '#/components/schemas/AimMcpProxyApiKeyPlanSecurity'
          OAUTH2: '#/components/schemas/AimMcpProxyOAuth2PlanSecurity'
      description: How consumers authenticate against the plan, discriminated by `type`
      oneOf:
        - $ref: '#/components/schemas/AimMcpProxyKeyLessPlanSecurity'
        - $ref: '#/components/schemas/AimMcpProxyApiKeyPlanSecurity'
        - $ref: '#/components/schemas/AimMcpProxyOAuth2PlanSecurity'
      x-speakeasy-param-computed: false
    AimMcpProxyKeyLessPlanSecurity:
      allOf:
        - type: object
          properties:
            type:
              type: string
              description: Type of plan security
              enum:
                - KEY_LESS
              default: KEY_LESS
          required: ["type"]
      description: No consumer authentication
    AimMcpProxyApiKeyPlanSecurity:
      allOf:
        - type: object
          properties:
            source:
              type: string
              enum:
                - HEADER
                - BEARER
                - QUERY_PARAMETER
              description: Where the gateway reads the API key from
              x-speakeasy-param-computed: false
            apiKeyHeader:
              type: string
              examples:
                - X-Gravitee-Api-Key
              description: Name of a custom header carrying the API key; naming one switches the gateway to that header
              x-speakeasy-param-computed: false
            propagateApiKey:
              type: boolean
              description: Forward the API key to the upstream server; false when omitted
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Type of plan security
              enum:
                - API_KEY
              default: API_KEY
              x-speakeasy-param-computed: false
          required:
            - source
            - "type"
      description: Consumers authenticate with an API key
    AimMcpProxyOAuth2PlanSecurity:
      allOf:
        - type: object
          properties:
            provider:
              type: string
              examples:
                - am
              description: The `name` of an `identityProviders` entry of this spec
              x-speakeasy-param-computed: false
            scopes:
              type: array
              items:
                type: string
              description: |
                Scopes required on top of the standard MCP scopes; accepted on a `GRAVITEE_AM` provider only, since
                the gateway checks them against the Access Management domain. On a plan added after creation the
                scopes cannot be registered on the domain and are rejected.
              x-speakeasy-param-computed: true
              x-speakeasy-plan-modifiers: IgnoreEmptyList
            type:
              type: string
              description: Type of plan security
              enum:
                - OAUTH2
              default: OAUTH2
              x-speakeasy-param-computed: false
          required:
            - provider
            - "type"
      description: |
        Consumers authenticate with OAuth 2.0 tokens the gateway validates against one of the proxy's identity
        providers, named by `provider`.
    AimMcpProxyFlowExecution:
      type: object
      properties:
        mode:
          type: string
          enum:
            - DEFAULT
            - BEST_MATCH
          description: Flow selection mode
          default: DEFAULT
          x-speakeasy-param-computed: false
        matchRequired:
          type: boolean
          description: Reject a request no flow matches; false when omitted
          default: false
          x-speakeasy-param-computed: false
      description: |
        How the gateway selects among the proxy's flows. `DEFAULT` runs every flow whose selectors match;
        `BEST_MATCH` runs the one whose selectors match best. Omitted, APIM's defaults apply and the state
        reports no execution block.
      x-speakeasy-param-computed: false
    AimMcpProxyFlow:
      type: object
      properties:
        name:
          type: string
          examples:
            - Tools ACL
          description: Name of the flow, shown in the policy studio; flows are compared by content, not by name
          x-speakeasy-param-computed: false
        enabled:
          type: boolean
          description: Whether the gateway runs the flow; true when omitted
          default: true
          x-speakeasy-param-computed: false
        selectors:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyFlowSelector'
          description: What the flow applies to; a flow without selectors applies to every request
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
        request:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyFlowStep'
          description: Steps run on the request, in order
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
        response:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyFlowStep'
          description: Steps run on the response, in order
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
        tags:
          type: array
          items:
            type: string
          description: Sharding tags of the gateways the flow runs on; all of them when omitted
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
      required:
        - name
      description: |
        A policy flow, the same shape APIM's own API resource declares: the requests it selects, and the steps
        run on the request and on the response. An MCP proxy has no other phase.
    AimMcpProxyFlowSelector:
      discriminator:
        propertyName: type
        mapping:
          MCP: '#/components/schemas/AimMcpProxyMcpFlowSelector'
          CONDITION: '#/components/schemas/AimMcpProxyConditionFlowSelector'
      description: What a flow applies to, discriminated by `type`; the kinds an MCP proxy accepts
      oneOf:
        - $ref: '#/components/schemas/AimMcpProxyMcpFlowSelector'
        - $ref: '#/components/schemas/AimMcpProxyConditionFlowSelector'
    AimMcpProxyMcpFlowSelector:
      allOf:
        - type: object
          properties:
            methods:
              type: array
              examples:
                - - tools/list
                  - tools/call
              items:
                type: string
              description: MCP methods the flow applies to, such as `tools/call`; every method when empty
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Kind of selector
              enum:
                - MCP
              default: MCP
              x-speakeasy-param-computed: false
          required:
            - methods
            - "type"
      description: Selects requests by MCP method
    AimMcpProxyConditionFlowSelector:
      allOf:
        - type: object
          properties:
            condition:
              type: string
              examples:
                - "{#context.attributes['mcp_tool_name'] == 'create_issue'}"
              description: Condition the request must satisfy
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Kind of selector
              enum:
                - CONDITION
              default: CONDITION
              x-speakeasy-param-computed: false
          required:
            - condition
            - "type"
      description: Selects requests by an expression-language condition
    AimMcpProxyFlowStep:
      type: object
      properties:
        name:
          type: string
          examples:
            - MCP ACL
          description: Name of the step, shown in the policy studio
          x-speakeasy-param-computed: false
        description:
          type: string
          description: Human description of the step
          x-speakeasy-param-computed: false
        enabled:
          type: boolean
          description: Whether the gateway runs the step; true when omitted
          default: true
          x-speakeasy-param-computed: false
        policy:
          type: string
          examples:
            - mcp-acl
            - rate-limit
          description: Id of a policy plugin deployed on the platform
          x-speakeasy-param-computed: false
        condition:
          type: string
          description: Expression-language condition the step runs under; always when omitted
          x-speakeasy-param-computed: false
        configuration:
          type: object
          additionalProperties: true
          description: Configuration of the policy, free-form as the policy's own schema defines it; validated against that schema on apply and dry run
          x-speakeasy-param-computed: false
          x-speakeasy-type-override: any
      required:
        - name
        - policy
      description: A policy run at one point of a flow, configured as that policy's schema says
    AimMcpProxyIdentityProvider:
      discriminator:
        propertyName: type
        mapping:
          GRAVITEE_AM: '#/components/schemas/AimMcpProxyGraviteeAmIdentityProvider'
          OAUTH2_GENERIC: '#/components/schemas/AimMcpProxyGenericIdentityProvider'
          OAUTH2_AUTH0: '#/components/schemas/AimMcpProxyAuth0IdentityProvider'
      description: |
        An authorization server declared on the proxy, discriminated by `type`. Each becomes an OAuth2 resource of
        the proxy's API, named after `name`, which OAUTH2 plans reference through `provider`.
      oneOf:
        - $ref: '#/components/schemas/AimMcpProxyGraviteeAmIdentityProvider'
        - $ref: '#/components/schemas/AimMcpProxyGenericIdentityProvider'
        - $ref: '#/components/schemas/AimMcpProxyAuth0IdentityProvider'
    AimMcpProxyGraviteeAmIdentityProvider:
      allOf:
        - type: object
          properties:
            name:
              type: string
              description: Name of the provider, the resource name on the proxy and the value plans reference
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Kind of authorization server
              enum:
                - GRAVITEE_AM
              default: GRAVITEE_AM
              x-speakeasy-param-computed: false
          required: ["name", "type"]
      description: |
        The Gravitee Access Management integration of the organization: the domain, the client and the resource are
        provisioned when the proxy is created, and the AM connection must exist at that moment. At most one per
        proxy, and fixed at creation.
    AimMcpProxyGenericIdentityProvider:
      allOf:
        - type: object
          properties:
            issuerUrl:
              type: string
              examples:
                - https://kc.example.com/realms/acme
              format: uri
              description: Issuer URL of the authorization server, the base the endpoints are resolved against
              x-speakeasy-param-computed: false
              x-speakeasy-plan-modifiers: TrimTrailingSlash
            introspectionEndpoint:
              type: string
              examples:
                - /protocol/openid-connect/token/introspect
              description: |
                Token introspection endpoint, as a path relative to `issuerUrl` or as an absolute URL beneath it;
                stored and reported as the path
              x-speakeasy-param-computed: false
            introspectionEndpointMethod:
              type: string
              enum:
                - GET
                - POST
              description: HTTP method of the introspection call
              x-speakeasy-param-computed: false
            clientId:
              type: string
              description: Client id the gateway introspects tokens with
              x-speakeasy-param-computed: false
            clientSecret:
              type: string
              format: password
              description: |
                Client secret the gateway introspects tokens with, a literal or a `secret://` URI stored verbatim and
                never returned. Omitted on a later apply, the stored secret is kept; a different value replaces the
                proxy's resource in place and redeploys the proxy, which is how a rotated reference reaches the gateway.
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            userInfoEndpoint:
              type: string
              description: UserInfo endpoint, same rule as `introspectionEndpoint`
              x-speakeasy-param-computed: false
            name:
              type: string
              description: Name of the provider, the resource name on the proxy and the value plans reference
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Kind of authorization server
              enum:
                - OAUTH2_GENERIC
              default: OAUTH2_GENERIC
              x-speakeasy-param-computed: false
          required:
            - issuerUrl
            - introspectionEndpoint
            - introspectionEndpointMethod
            - "name"
            - "type"
      description: A third-party authorization server the gateway introspects tokens with
    AimMcpProxyAuth0IdentityProvider:
      allOf:
        - type: object
          properties:
            domain:
              type: string
              examples:
                - my-tenant.eu.auth0.com
              description: Auth0 tenant domain
              x-speakeasy-param-computed: false
            audience:
              type: string
              description: Audience of the tokens the gateway accepts
              x-speakeasy-param-computed: false
            name:
              type: string
              description: Name of the provider, the resource name on the proxy and the value plans reference
              x-speakeasy-param-computed: false
            type:
              type: string
              description: Kind of authorization server
              enum:
                - OAUTH2_AUTH0
              default: OAUTH2_AUTH0
              x-speakeasy-param-computed: false
          required:
            - domain
            - audience
            - "name"
            - "type"
      description: An Auth0 tenant the gateway validates tokens against
    AimMcpProxyState:
      allOf:
        - $ref: '#/components/schemas/AimMcpProxySpec'
        - $ref: '#/components/schemas/AimResourceStatus'
      description: |
        State of an MCP proxy that has been created or updated, in the shape of its spec. Identity providers are
        read off the resources of its API and plans off APIM, both sorted by name; `state` is the lifecycle APIM
        observes; `flows` and each plan's `flows` are read off APIM in stored order, step configurations as
        stored, and are absent when there are none; `flowExecution` is reported when it differs from APIM's
        defaults. For a `STUDIO`, `studio.tools` is read off the stored specification with each tool's
        `entityId` and sorted by server then tool, `studio.upstreamAuth` off the stored backends without
        credentials, and `studio.enableFGA` off the API's flows, which `flows` reports without the platform's
        authorization flow.
    AimHttpError:
      type: object
      properties:
        httpStatus:
          type: integer
          examples:
            - 400
          format: int32
          description: HTTP status code
          x-speakeasy-param-computed: false
        message:
          type: string
          examples:
            - entityId [mcp-server.github] is already used by another MCP server
          description: Human readable message
          x-speakeasy-param-computed: false
        technicalCode:
          type: string
          examples:
            - mcp-server.already-exists
          description: Stable technical code of the error
          x-speakeasy-param-computed: false
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Values interpolated into the message, keyed by placeholder name
          x-speakeasy-param-computed: false
      description: An error returned by the Automation API when a request could not be served.
    DocumentationPortalSpec:
      $ref: "#/components/schemas/DocumentationSpec"
      description: Specification for a Portal Documentation page.
      x-speakeasy-entity: DocumentationPortal
    DocumentationPortalStatus:
      description: Status information for a Portal Documentation page after import.
      allOf:
        - $ref: "#/components/schemas/BaseStatus"
        - type: object
          properties:
            portalHrid:
              type: string
              description: The HRID of the portal this documentation page belongs to.
              readOnly: true
              x-speakeasy-plan-modifiers: Immutable
    DocumentationPortalState:
      description: State of a Portal Documentation page that has been created/updated.
      allOf:
        - $ref: "#/components/schemas/DocumentationPortalSpec"
        - $ref: "#/components/schemas/DocumentationPortalStatus"
    DocumentationApiSpec:
      description: Specification for an API Documentation page.
      $ref: "#/components/schemas/DocumentationSpec"
      x-speakeasy-entity: DocumentationApi
    DocumentationApiStatus:
      description: Status information for an API Documentation page after import.
      allOf:
        - $ref: "#/components/schemas/BaseStatus"
        - type: object
          properties:
            apiHrid:
              type: string
              description: The HRID of the API this documentation page belongs to.
              readOnly: true
              x-speakeasy-plan-modifiers: Immutable
    DocumentationApiState:
      description: State of an API Documentation page that has been created/updated.
      allOf:
        - $ref: "#/components/schemas/DocumentationApiSpec"
        - $ref: "#/components/schemas/DocumentationApiStatus"
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
    Unauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
    BadRequest:
      description: Request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
    Error:
      description: Default error
      content:
        application/json:
          schema:
            type: object
            allOf:
              - $ref: "#/components/schemas/HttpError"
    AimUnauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AimHttpError'
    AimUnauthorized:
      description: The caller lacks the permission, or the license does not include AI Management
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AimHttpError'
    AimNotFound:
      description: No resource with this HRID, or AI Management is not available on this installation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AimHttpError'
    AimError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AimHttpError'
  parameters:
    envIdParam:
      name: envId
      in: path
      required: true
      description: environment ID
      schema:
        type: string
        default: DEFAULT
        examples:
          - a44e0d1b-9fa9-4d64-8b76-3634623a2e27
      x-speakeasy-name-override: environmentId
    orgIdParam:
      name: orgId
      in: path
      required: true
      description: organization ID
      schema:
        type: string
        default: DEFAULT
        examples:
          - dedd0e0f-b3e9-4d2f-89cd-b2a9de7cb145
      x-speakeasy-name-override: organizationId
    dryRunQueryParam:
