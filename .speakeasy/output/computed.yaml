                - NONE
              default: NONE
          required: ["type"]
      description: No authentication
    AimCatalogMcpServerHeaderAuth:
      allOf:
        - type: object
          properties:
            name:
              type: string
              examples:
                - Authorization
              description: Header name
              x-speakeasy-param-computed: false
            value:
              type: string
              format: password
              description: Full header value, a literal or a `secret://` URI stored verbatim; never returned
              writeOnly: true
              x-speakeasy-param-computed: false
              x-speakeasy-param-sensitive: true
            type:
              type: string
              description: Type of authentication
              enum:
                - HEADER
              default: HEADER
              x-speakeasy-param-computed: false
          required:
            - name
            - value
            - "type"
      description: |
        A static header sent on every request. Write the full header value: `Bearer <token>` for a bearer token,
        `Basic <base64>` for basic credentials, or the raw key for an API-key header — or point the whole value at a
        secret with a `secret://` URI.
