                  source: HEADER
          items:
            $ref: '#/components/schemas/AimMcpProxyPlan'
          minItems: 1
          description: |
            Plans consumers subscribe to, converged by name: a declared plan the proxy does not have is created
            and published, a plan the proxy holds in staging is published, a plan the declaration no longer
            carries is closed — closing terminates its subscriptions — and a plan cannot be changed in place
            under the same name. At least one plan is required.
          x-speakeasy-param-computed: false
          x-speakeasy-plan-validators: SortedByName
      required:
        - hrid
        - entityId
        - name
        - contextPath
        - mode
        - plans
      description: |
        Specification of an MCP proxy. In `PROXY` mode the gateway exposes one upstream MCP server, declared under
        `proxy`, at `contextPath`; in `STUDIO` mode it exposes a curated set of tools picked from catalog MCP
        servers, declared under `studio`. Both sit behind the declared plans, which
        authenticate consumers against the declared identity providers, and run the declared policy flows on the
        traffic. `mode` and `entityId` are fixed at creation; `name`, `description`, `proxy`,
        `studio`, `contextPath`, the identity providers, the plan set, the flows and the lifecycle `state` converge
        on re-apply.
      x-speakeasy-entity: McpProxy
    AimMcpProxyLifecycleState:
      type: string
      enum:
        - STARTED
        - STOPPED
      description: |
        Lifecycle of the proxy on the gateway. `STARTED` runs it with the last applied definition and redeploys it
        after every apply that changes it; `STOPPED` makes the gateway answer 404 and stores changes without
        deploying them, which the next `STARTED` does. `STARTED` when omitted. Reported back as the lifecycle APIM
        observes. A start or a deploy the gateway side refuses fails the apply with a `500` carrying the technical
        code `gamma.mcp.lifecycle.failed` and the operation, the proxy and the cause as parameters; the declaration
        is stored, and the next apply starts the proxy or redeploys the one APIM reports out of sync.
      default: STARTED
    AimMcpProxyMode:
      type: string
      enum:
        - PROXY
        - STUDIO
      description: |
        Shape of the proxy, and the one block it carries: `PROXY` fronts one upstream MCP server, declared under
        `proxy`; `STUDIO` composes a curated tool surface out of catalog MCP servers, declared under `studio`. The
        other mode's block is rejected. Required. Fixed at creation: declaring another mode on
        an existing proxy is rejected, and changing it is a delete and a new declaration.
      x-speakeasy-plan-modifiers: Immutable
    AimMcpProxyProxy:
      type: object
      properties:
        serverUrl:
          type: string
          examples:
            - https://api.githubcopilot.com/mcp/
          format: uri
          description: URL of the upstream MCP server, http or https; the gateway reaches it at runtime
          x-speakeasy-param-computed: false
        upstreamAuth:
          x-speakeasy-param-computed: false
          allOf:
            - $ref: '#/components/schemas/AimMcpProxyUpstreamAuth'
          writeOnly: true
      required:
