                request:
                  - name: MCP ACL
                    policy: mcp-acl
                    configuration:
                      authorizations:
                        - authorizedFeatures:
                            - type: TOOLS
                              methods:
                                - TOOLS_LIST
                                - TOOLS_CALL
                              patternType: ANY
          items:
            $ref: '#/components/schemas/AimMcpProxyFlow'
          description: |
            Policy flows of the proxy, in execution order, run after the flows of the plan the request matched.
            The manifest owns them: on every apply the proxy's flows are replaced by the declared ones, so a
            flow authored in the policy studio survives only if the manifest carries it, and omitting `flows`
            removes them all. Each step's configuration is validated against its policy's schema, on apply and
            on dry run, and reported back as stored.
          x-speakeasy-param-computed: true
          x-speakeasy-plan-modifiers: IgnoreEmptyList
        identityProviders:
          type: array
          examples:
