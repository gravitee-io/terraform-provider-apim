        state:
          $ref: '#/components/schemas/AimMcpProxyLifecycleState'
          x-speakeasy-param-computed: false
        flowExecution:
          $ref: '#/components/schemas/AimMcpProxyFlowExecution'
          x-speakeasy-param-computed: false
        flows:
          type: array
          examples:
            - - name: Tools ACL
                selectors:
                  - type: MCP
                    methods:
