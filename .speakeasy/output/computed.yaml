      description: |
        What a `PROXY` fronts: one upstream MCP server and the credential the gateway presents to it. Required when
        `mode` is `PROXY`, rejected otherwise.
      x-speakeasy-param-computed: false
    AimMcpProxyStudio:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyStudioTool'
          minItems: 1
          description: |
            The tools the studio exposes, each named by the catalog server it comes from and its runtime name.
            Every server named here needs an `upstreamAuth` entry. On a studio created with a `GRAVITEE_AM`
            provider, a tool added after creation is served but not registered as a scope on the Access
            Management domain; the apply reports it as a warning.
          x-speakeasy-param-computed: false
          x-speakeasy-plan-validators: SortedByServerAndTool
        upstreamAuth:
          type: array
          items:
            $ref: '#/components/schemas/AimMcpProxyStudioUpstreamAuth'
          description: |
            One entry per catalog server a tool comes from: the credential the gateway presents to that server,
            stored verbatim and never returned, or `type: NONE` to say the server needs none. Nothing is inferred
            from the credential the catalog synced the server with. An entry for a server no tool uses, a server
            without an entry, or two entries for one server are rejected.
          x-speakeasy-param-computed: false
          writeOnly: true
        enableFGA:
          type: boolean
          description: |
