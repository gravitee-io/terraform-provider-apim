        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
      x-speakeasy-entity-operation:
        - APIV4#read
        - APIV4#create#2
        - APIV4#update#2
      x-speakeasy-group: apis
      x-speakeasy-name-override: get
    delete:
