  /organizations/{orgId}/environments/{envId}/aim/mcp-proxies:
    put:
      operationId: createOrUpdateAimMcpProxy
      summary: Create or update an MCP proxy from its spec
      description: |
        Create or update a single-upstream MCP proxy, identified by the `hrid` carried in the body. Re-applying an
        unchanged spec is a no-op. A first apply creates the proxy and, unless `state` is `STOPPED`, starts it; a
        later apply converges the mutable parts — `name`, `description`, `proxy`, `contextPath`, the identity
        providers and the plan set — and, while the proxy runs, redeploys it once. The lifecycle converges too: `STARTED`
        starts a stopped proxy, `STOPPED` stops a running one and keeps later changes stored until the next
        `STARTED`. Policy flows are owned by the declaration: the proxy's flows and each declared plan's flows are
        replaced by the declared ones whenever they differ, and a flow the declaration no longer carries is
        removed. Identity providers converge by name: a declared provider the proxy does not have is attached
        as a resource of its API, a declared provider whose configuration differs from the proxy's resource is
        rejected — except a generic provider's `clientSecret`, which replaces the stored one when it differs and
        is kept when omitted — and a resource the declaration no longer names is left in place. The `GRAVITEE_AM`
        provider is provisioned when the proxy is created and cannot be added later. Plans converge by name: a declared plan
        the proxy does not have is created and published, a plan the proxy holds in staging is published, a plan
        the declaration no longer carries is closed — closing terminates its subscriptions — and a deprecated plan
        is rejected, as APIM cannot publish it again. `entityId` is fixed at creation, and a plan cannot be changed
        in place under the same name: declaring a different value is rejected rather than applied. The upstream
        server is not contacted — the gateway reaches it at runtime.
        A `STUDIO` (`mode: STUDIO`) is declared from servers registered under `catalog/mcp-servers`: `studio.tools`
        names each tool by its server's HRID and runtime name, converges as a set and replaces the studio's tool
        surface when it changes; `studio.upstreamAuth` converges per server; `studio.enableFGA` inserts or removes
        the platform's authorization flow. `mode` is fixed at creation.
        Findings that prevent the apply are reported in `errors.severe` with a `400`, and nothing is persisted or
        destroyed. A dry run performs the same checks. A start or a deploy the gateway side refuses answers `500`
        with the technical code `gamma.mcp.lifecycle.failed`: the declaration is stored and the next apply retries,
        redeploying a running proxy APIM reports out of sync even when nothing changed.
      tags:
        - MCP Proxies
      requestBody:
        description: MCP proxy specification
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AimMcpProxySpec'
            examples:
              proxy:
                summary: A GitHub MCP proxy behind an API key plan
                value:
                  hrid: github-mcp-proxy
                  entityId: mcp-proxy.github
                  name: GitHub
                  contextPath: /mcp/github
                  mode: PROXY
                  proxy:
                    serverUrl: https://api.githubcopilot.com/mcp/
                    upstreamAuth:
                      type: BEARER
                      token: 'secret://kubernetes/github-mcp:token'
                  plans:
                    - name: gold
                      security:
                        type: API_KEY
                        source: HEADER
              proxyBehindKeycloak:
                summary: A proxy whose plans authenticate against Keycloak and against Gravitee AM
                value:
                  hrid: github-mcp-proxy
                  entityId: mcp-proxy.github
                  name: GitHub
                  contextPath: /mcp/github
                  mode: PROXY
                  proxy:
                    serverUrl: https://api.githubcopilot.com/mcp/
                  state: STARTED
                  identityProviders:
                    - name: am
                      type: GRAVITEE_AM
                    - name: keycloak
                      type: OAUTH2_GENERIC
                      issuerUrl: https://kc.example.com/realms/acme
                      introspectionEndpoint: /protocol/openid-connect/token/introspect
                      introspectionEndpointMethod: POST
                      clientId: gateway
                      clientSecret: 'secret://kubernetes/keycloak-gateway:client-secret'
                  flows:
                    - name: Tools ACL
                      selectors:
                        - type: MCP
                          methods:
                            - tools/list
                            - tools/call
                      request:
                        - name: MCP ACL
                          policy: mcp-acl
                          configuration:
                            authorizations:
                              - authorizedFeatures:
                                  - type: TOOLS
                                    methods:
                                      - TOOLS_LIST
                                      - TOOLS_CALL
                                    patternType: ANY
                  plans:
                    - name: gold
                      security:
                        type: OAUTH2
                        provider: am
                        scopes:
                          - repo:read
                      flows:
                        - name: Gold rate limit
                          selectors:
                            - type: MCP
                              methods:
                                - tools/call
                          request:
                            - name: Rate limit
                              policy: rate-limit
                              configuration:
                                rate:
                                  limit: 100
                                  periodTime: 1
                                  periodTimeUnit: MINUTES
                    - name: partners
                      security:
                        type: OAUTH2
                        provider: keycloak
              studio:
                summary: A studio exposing two GitHub tools and one Jira tool, with fine-grained authorization
                value:
                  hrid: support-studio
                  entityId: mcp-proxy.support-studio
                  name: Support Studio
                  contextPath: /mcp/support
                  mode: STUDIO
                  studio:
                    tools:
                      - server: github-mcp
                        tool: create_issue
                      - server: github-mcp
                        tool: search_issues
                        alias: gh_search
                      - server: jira-mcp
                        tool: create_ticket
                    upstreamAuth:
                      - server: github-mcp
                        auth:
                          type: BEARER
                          token: 'secret://kubernetes/github-mcp:token'
                      - server: jira-mcp
                        auth:
                          type: NONE
                    enableFGA: true
                  plans:
                    - name: gold
                      security:
                        type: API_KEY
                        source: HEADER
        required: true
      responses:
        "200":
          description: State of the created or updated MCP proxy, or the dry-run preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimMcpProxyState'
              examples:
                applied:
                  summary: The state answered after the apply, credentials removed
                  value:
                    hrid: github-mcp-proxy
                    entityId: mcp-proxy.github
                    name: GitHub
                    contextPath: /mcp/github
                    mode: PROXY
                    proxy:
                      serverUrl: https://api.githubcopilot.com/mcp/
                      upstreamAuth:
                        type: BEARER
                    state: STARTED
                    plans:
                      - name: gold
                        security:
                          type: API_KEY
                          source: HEADER
                    id: 2a5bce95-bd0c-4bc0-a30d-72e299047a09
                    environmentId: DEFAULT
                    organizationId: DEFAULT
        "401":
          $ref: '#/components/responses/AimUnauthenticated'
        "403":
          $ref: '#/components/responses/AimUnauthorized'
        "404":
          $ref: '#/components/responses/AimNotFound'
        default:
          $ref: '#/components/responses/AimError'
      parameters:
        - $ref: '#/components/parameters/orgIdParam'
        - $ref: '#/components/parameters/envIdParam'
        - $ref: '#/components/parameters/dryRunQueryParam'
      x-speakeasy-entity-operation: McpProxy#create,update
      x-speakeasy-name-override: createOrUpdate
