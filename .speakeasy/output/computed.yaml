        Create or update an upstream MCP server registered in the AI Catalog, identified by the `hrid` carried in the
        body. Re-applying an unchanged spec is a no-op. When the connection is new or changed, or the server was never
        synced, the platform discovers the server before persisting anything and syncs its tools, prompts and
