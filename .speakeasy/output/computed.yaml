openapi: 3.1.0
info:
  title: Gravitee
  description: |-
    Gravitee API Management Terraform Provider

    You can manage with Terraform the following:
    * APIs (V4 of all types)
    * Shared Policy Groups
    * Applications
    * Subscriptions
    * Group
    * Dictionaries
    * Portals
    * Portal Listings
    * Documentations
    * MCP Catalog Servers
    * MCP Proxies

    [Get started with APIM + Terraform and learn about changes and known limitations](https://documentation.gravitee.io/apim/terraform)

    Checkout other sections to configure, authenticate and start working with Gravitee resources
  contact:
    name: AI Management team
    url: https://www.gravitee.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: https://eu.cloudgate.gravitee.io/apim/automation
tags:
  - name: APIs
    description: Everything about APIs
  - name: Applications
    description: Everything about Applications
  - name: Shared Policy Group
    description: Everything about Shared Policy Groups
  - name: Groups
    description: Everything about Groups
  - name: Dictionaries
    description: Everything about Dictionaries
  - name: Subscriptions
    description: Everything about subscriptions
  - name: Portals
    description: Everything about Portals (next-gen developer portal)
  - name: Portal Listings
    description: Everything about Portal Listings (publishing APIs to a portal)
  - name: Portal Documentations
    description: Everything about Portal Documentations
  - name: API Documentations
    description: Everything about API Documentations (next-gen portal)
  - name: AI Catalog
    description: Upstream MCP servers registered in the AI Catalog.
  - name: MCP Proxies
    description: MCP proxies exposing an upstream MCP server through the gateway.
paths:
  # APIs
  /organizations/{orgId}/environments/{envId}/apis:
    put:
      operationId: createOrUpdateApis
      tags:
        - APIs
      summary: Create or update APIs from APISpec
      description: Create/update APIs from API Spec
      parameters:
        - $ref: "#/components/parameters/orgIdParam"
        - $ref: "#/components/parameters/envIdParam"
        - $ref: "#/components/parameters/dryRunQueryParam"
      requestBody:
        description: API Specification
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ApiV4Spec"
        required: true
      responses:
        "200":
          description: State of the successfully created/updated API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiV4State"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
      x-speakeasy-entity-operation: APIV4#create,update
      x-speakeasy-group: apis
      x-speakeasy-name-override: createOrUpdate
  /organizations/{orgId}/environments/{envId}/apis/{hrid}:
