overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Group overlay
  version: 0.0.1
actions:

  # Entity management
  - target: $.components.schemas.GroupSpec
    update:
      x-speakeasy-entity:
        Group
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups"].put
    update:
      x-speakeasy-entity-operation: Group#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups/{hrid}"].get
    update:
      x-speakeasy-entity-operation: Group#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: Group#delete

  # Ignore diff
  - target: $.components.schemas.GroupSpec.properties.members
    description: Ignore diff when API returns empty list
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-param-plan-modifiers: IgnoreEmptyList
      # members joined outside Terraform (IdP group mapping, with ignore_members) must not show as "known after apply"
      x-speakeasy-param-suppress-computed-diff: true

  - target: $.components.schemas.GroupSpec.properties.defaultMemberRoles
    description: The group may hold default roles the configuration does not declare
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-param-suppress-computed-diff: true
  - target: $.components.schemas.GroupDefaultMemberRoles
    description: >-
      defaultMemberRoles is a $ref, so the suppression above does not reach the generated attribute;
      set it on the referenced object too, as for ApplicationSettings.
    update:
      x-speakeasy-param-suppress-computed-diff: true

  # Status management
  - target: $.components.schemas.GroupStatus.allOf[?@.properties.memberCount].properties.memberCount
    description: Not required by the provider
    update:
      x-speakeasy-terraform-ignore: true
