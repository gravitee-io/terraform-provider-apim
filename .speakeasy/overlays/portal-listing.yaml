overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Portal Listing overlay
  version: 0.0.1
actions:

  - target: $.components.schemas.PortalListingApiEntry.properties.visibility
    description: Keep the declared visibility; inheritance is resolved in the navigation tree
    update:
      $ref: "#/components/schemas/DeclaredPortalVisibility"
      x-speakeasy-param-computed: false

  # Entity management
  - target: $.components.schemas.PortalListingSpec
    update:
      x-speakeasy-entity:
        PortalListing
  - target: $.components.schemas.PortalListingSpec.properties.apis
    description: At least one API must be included in a portal listing
    update:
      minItems: 1
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings"].put
    update:
      x-speakeasy-entity-operation: PortalListing#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings/{hrid}"].get
    update:
      x-speakeasy-entity-operation: PortalListing#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: PortalListing#delete

  # Parent portal cannot change on an existing listing
  - target: $.components.schemas.PortalListingStatus.allOf[?@.properties.portalHrid].properties.portalHrid
    description: Portal cannot be changed on an existing listing
    update:
      x-speakeasy-plan-modifiers: Immutable
