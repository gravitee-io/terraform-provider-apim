overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Portal overlay
  version: 0.0.1
actions:

  # Entity management
  - target: $.components.schemas.PortalSpec
    update:
      x-speakeasy-entity:
        Portal
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals"].put
    update:
      x-speakeasy-entity-operation: Portal#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{hrid}"].get
    update:
      x-speakeasy-entity-operation: Portal#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: Portal#delete

  # APIM returns both navigation aliases; only explicitly configured values are inputs.
  - target: $.components.schemas.PortalSpec.properties.navigation
    description: Preserve computed navigation unless configured structure changes
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-plan-modifiers: PortalNavigation
      description: >-
        Deprecated. Use `structure.top_navbar` instead. Configure only one of
        `navigation` or `structure`; APIM returns both aliases in state.

  - target: $.components.schemas.PortalSpec.properties.structure
    description: Preserve APIM-managed navigation when structure is omitted
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-plan-modifiers: PortalStructure

  - target: $.components.schemas.PortalNavigationStructure
    description: Preserve APIM-managed navigation when structure is omitted
    update:
      x-speakeasy-param-computed: true
      x-speakeasy-plan-modifiers: PortalStructure
      description: >-
        Portal navigation grouped by area. Omitting both `structure` and
        `navigation`, or setting both to `null`, preserves existing navigation,
        including after import and during unrelated updates. When `structure`
        is configured, `top_navbar` must be an explicit list: use
        `structure = { top_navbar = [] }` to clear navigation. `structure = {}`
        and `structure = { top_navbar = null }` are rejected rather than clearing
        entries implicitly. TBD (to be discussed): requiring an explicit
        `top_navbar` within a configured structure.
