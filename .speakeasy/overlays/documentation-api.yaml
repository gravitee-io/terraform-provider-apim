overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Documentation API overlay
  version: 0.0.1
actions:

  - target: $.components.schemas
    description: Create an alias to a specific type
    update:
      DocumentationApiSpec:
        description: Specification for an API Documentation page.
        $ref: "#/components/schemas/DocumentationSpec"
        x-speakeasy-entity: DocumentationApi
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"].put.requestBody.content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationApiSpec"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"].put
    update:
      x-speakeasy-entity-operation: DocumentationApi#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations/{hrid}"].get
    update:
      x-speakeasy-entity-operation: DocumentationApi#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: DocumentationApi#delete

  - target: $.components.schemas
    update:
      DocumentationApiStatus:
        description: Status information for an API Documentation page after import.
        allOf:
          - $ref: "#/components/schemas/BaseStatus"
          - type: object
            properties:
              apiHrid:
                type: string
                description: The HRID of the API this documentation page belongs to.
                readOnly: true
      DocumentationApiState:
        description: State of an API Documentation page that has been created/updated.
        allOf:
          - $ref: "#/components/schemas/DocumentationApiSpec"
          - $ref: "#/components/schemas/DocumentationApiStatus"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"].put.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationApiState"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations/{hrid}"].get.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationApiState"
  - target: $.components.schemas.DocumentationApiStatus.allOf[?@.properties.apiHrid].properties.apiHrid
    update:
      x-speakeasy-plan-modifiers: Immutable
