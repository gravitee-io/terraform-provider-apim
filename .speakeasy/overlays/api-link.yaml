overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: API Link overlay
  version: 0.0.1
actions:
  - target: $.components.schemas
    description: Give the api-attached link its own Terraform entity and parent scope
    update:
      ApiLinkSpec:
        $ref: "#/components/schemas/PortalLinkSpec"
        x-speakeasy-entity: ApiLink
      ApiLinkStatus:
        allOf:
          - $ref: "#/components/schemas/BaseStatus"
          - type: object
            properties:
              apiHrid:
                type: string
                readOnly: true
                description: HRID of the parent API.
                x-speakeasy-plan-modifiers: Immutable
      ApiLinkState:
        allOf:
          - $ref: "#/components/schemas/ApiLinkSpec"
          - $ref: "#/components/schemas/ApiLinkStatus"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"].put
    update:
      x-speakeasy-entity-operation: ApiLink#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"].get
    update:
      x-speakeasy-entity-operation: ApiLink#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: ApiLink#delete
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"].put.requestBody.content["application/json"].schema
    update:
      $ref: "#/components/schemas/ApiLinkSpec"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"].put.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/ApiLinkState"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"].get.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/ApiLinkState"
