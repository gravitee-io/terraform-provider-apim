overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Documentation Portal overlay
  version: 0.0.1
actions:
  - target: $.components.schemas
    update:
      DocumentationPortalSpec:
        $ref: "#/components/schemas/DocumentationSpec"
  - target: $.components.schemas.DocumentationPortalSpec
    update:
      x-speakeasy-entity: DocumentationPortal
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"].put
    update:
      x-speakeasy-entity-operation: DocumentationPortal#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"].get
    update:
      x-speakeasy-entity-operation: DocumentationPortal#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: DocumentationPortal#delete

  - target: $.components.schemas.DocumentationStatus.allOf[?@.properties.portalHrid].properties.portalHrid
    update:
      x-speakeasy-plan-modifiers: Immutable
