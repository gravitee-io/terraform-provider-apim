overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Documentation Portal overlay
  version: 0.0.1
actions:
  - target: $.components.schemas.DocumentationSpec.properties["visibility", "location", "order"]
    description: Preserve inherited visibility and server-selected navigation defaults
    update:
      x-speakeasy-param-computed: true

  - target: $.components.schemas.DocumentationArea
    description: Shared by portal and API pages, so say where HOMEPAGE applies
    update:
      description: >-
        Where the documentation page appears. `TOP_NAVBAR` (default) places the page in the
        navigation. `HOMEPAGE` makes a portal page the portal's homepage: APIM rejects it on API
        documentation. A portal has one homepage. Applying it replaces a homepage created in the
        Console, and a second homepage managed by the Automation API with a different HRID fails
        with 409.

  - target: $.components.schemas
    description: Create an alias to a specific type
    update:
      DocumentationPortalSpec:
        $ref: "#/components/schemas/DocumentationSpec"
        description: Specification for a Portal Documentation page.
        x-speakeasy-entity: DocumentationPortal
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"].put.requestBody.content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationPortalSpec"
      x-speakeasy-entity: DocumentationPortal
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"].put
    update:
      x-speakeasy-entity-operation: DocumentationPortal#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"].get
    update:
      x-speakeasy-entity-operation:
        - DocumentationPortal#read
        - DocumentationPortal#create#2
        - DocumentationPortal#update#2
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: DocumentationPortal#delete

  - target: $.components.schemas
    update:
      DocumentationPortalStatus:
        description: Status information for a Portal Documentation page after import.
        allOf:
          - $ref: "#/components/schemas/BaseStatus"
          - type: object
            properties:
              portalHrid:
                type: string
                description: The HRID of the portal this documentation page belongs to.
                readOnly: true
      DocumentationPortalState:
        description: State of a Portal Documentation page that has been created/updated.
        allOf:
          - $ref: "#/components/schemas/DocumentationPortalSpec"
          - $ref: "#/components/schemas/DocumentationPortalStatus"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"].put.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationPortalState"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"].get.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/DocumentationPortalState"
  - target: $.components.schemas.DocumentationPortalStatus.allOf[?@.properties.portalHrid].properties.portalHrid
    update:
      x-speakeasy-plan-modifiers: Immutable
