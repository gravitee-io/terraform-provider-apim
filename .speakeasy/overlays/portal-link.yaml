overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Portal Link overlay
  version: 0.0.1
actions:
  - target: $.components.schemas
    description: Give the portal-attached link its own Terraform entity and parent scope
    update:
      PortalAttachedLinkSpec:
        $ref: "#/components/schemas/PortalLinkSpec"
        x-speakeasy-entity: PortalLink
      PortalAttachedLinkStatus:
        allOf:
          - $ref: "#/components/schemas/BaseStatus"
          - type: object
            properties:
              portalHrid:
                type: string
                readOnly: true
                description: HRID of the parent portal.
                x-speakeasy-plan-modifiers: Immutable
      PortalAttachedLinkState:
        allOf:
          - $ref: "#/components/schemas/PortalAttachedLinkSpec"
          - $ref: "#/components/schemas/PortalAttachedLinkStatus"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"].put
    update:
      x-speakeasy-entity-operation: PortalLink#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"].get
    update:
      x-speakeasy-entity-operation: PortalLink#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: PortalLink#delete
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"].put.requestBody.content["application/json"].schema
    update:
      $ref: "#/components/schemas/PortalAttachedLinkSpec"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"].put.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/PortalAttachedLinkState"
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"].get.responses["200"].content["application/json"].schema
    update:
      $ref: "#/components/schemas/PortalAttachedLinkState"
  - target: $.components.schemas.PortalLinkSpec.properties["visibility", "location", "order"]
    description: Inherit visibility and preserve server-selected navigation defaults
    update:
      x-speakeasy-param-computed: true
