overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: What the synced document carries and the provider does not ship
  version: 0.0.2
actions:

  # The Automation API document is synced as a whole, so it brings paths,
  # schemas and attributes no one has wired into the provider: no overlay, no
  # test, no check against the older APIM versions the provider supports. They
  # are removed from the document before generation, so the generated code of
  # the existing resources and SDK stays what it is on main. The work that owns
  # each of them takes its entries out of this file.

  ## Portal links, portal themes and API links: paths and schemas
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"]
    remove: true
  - target: $.components.schemas.PortalLinkSpec
    remove: true
  - target: $.components.schemas.PortalLinkState
    remove: true
  - target: $.components.schemas.PortalLinkStatus
    remove: true
  - target: $.components.schemas.PortalThemeSpec
    remove: true
  - target: $.components.schemas.PortalThemeState
    remove: true
  - target: $.components.schemas.PortalNextThemeDefinition
    remove: true
  - target: $.components.schemas.PortalNextThemeColor
    remove: true
  - target: $.components.schemas.PortalNextThemeFont
    remove: true
  - target: $.components.schemas.PortalNextThemeBackground
    remove: true

  ## Portal theme, homepage area and navigation visibility on existing resources
  - target: $.components.schemas.PortalSpec.properties.activeThemeHrid
    remove: true
  - target: $.components.schemas.PortalSpec.properties.structure
    remove: true
  - target: $.components.schemas.PortalNavigationStructure
    remove: true
  - target: $.components.schemas.PortalSpec.properties.navigation.deprecated
    description: The deprecation points at structure, removed above
    remove: true
  - target: $.components.schemas.PortalSpec.properties.navigation
    update:
      description: |
        The portal's navigation hierarchy as a flat list of paths.
        Paths are ordered — the order in the list is preserved.
        Intermediate folders are implicitly created if not listed explicitly.
  - target: $.components.schemas.PortalNavigationPath.properties.visibility
    remove: true
  - target: $.components.schemas.NavigationPath.properties.visibility
    remove: true
  - target: $.components.schemas.PortalListingApiEntry.properties.visibility
    remove: true
  - target: $.components.schemas.DocumentationSpec.properties.visibility
    remove: true
  - target: $.components.schemas.DocumentationSpec.properties.area
    remove: true
  - target: $.components.schemas.PortalVisibility
    remove: true
  - target: $.components.schemas.DocumentationArea
    remove: true

  ## Dictionary encryption (GKO-3070)
  - target: $.components.schemas.ManualDictionarySpec.properties.encryptedProperties
    remove: true
  - target: $.components.schemas.ManualDictionarySpec
    description: properties was required before encryptedProperties became an alternative
    update:
      required:
        - properties
  - target: $.components.schemas.EncryptableValue
    remove: true
  - target: $.components.schemas.DynamicDictionarySpec.properties.encryption
    remove: true
  - target: $.components.schemas.DictionaryEncryptionPolicy
    remove: true

  ## HTTP listener, CORS and tracing properties
  - target: $.components.schemas.HttpListener.allOf[*].properties.pathMappings
    remove: true
  - target: $.components.schemas.HttpListener.allOf[*].properties.requestValidation
    remove: true
  - target: $.components.schemas.RequestValidation
    remove: true
  - target: $.components.schemas.Cors.properties.allowPrivateNetwork
    remove: true
  - target: $.components.schemas.TracingV4.properties.redaction
    remove: true
  - target: $.components.schemas.TracingRedactionConfig
    remove: true
  - target: $.components.schemas.TracingRedactionRule
    remove: true
  - target: $.components.schemas.TracingMaskingStrategy
    remove: true

  ## Native connection events
  - target: $.components.schemas.Analytics.properties.connectionEvents
    remove: true

  ## Changes to what the provider already ships
  - target: $.components.schemas.Hrid
    description: Dots in an hrid are new upstream and unverified against the provider's older APIM versions
    update:
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]+[a-zA-Z0-9]$'
  - target: $.components.schemas.ApplicationOAuthClientSettings.properties.additionalClientMetadata.description
    remove: true
