overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: AuthZ schema overlay
  version: 0.0.1
actions:

  # Entity management
  - target: $.components.schemas.AuthzSchemaSpec
    update:
      x-speakeasy-entity:
        AuthzSchema
      x-speakeasy-entity-description: >-
        A GAPL schema document, enforced by the PDP gateway its `target` names.
        Without a target the document is stored and published nowhere; a target
        another schema holds is refused. Requires APIM 4.14 or later.
  - target: $.paths["/organizations/{orgId}/environments/{envId}/authz/schemas"].put
    update:
      x-speakeasy-entity-operation: AuthzSchema#create,update
  - target: $.paths["/organizations/{orgId}/environments/{envId}/authz/schemas/{hrid}"].get
    update:
      x-speakeasy-entity-operation: AuthzSchema#read
  - target: $.paths["/organizations/{orgId}/environments/{envId}/authz/schemas/{hrid}"].delete
    update:
      x-speakeasy-entity-operation: AuthzSchema#delete

  # Computed
  # Computed, a target left out of the configuration would keep the state's: the
  # platform withdraws an untargeted document from every gateway.
  - target: $.components.schemas.AuthzRoutingScope
    description: Ignored by speakeasy (because used as $ref) so setting computed false for the component
    update:
      x-speakeasy-param-computed: false
